<div class="fixed bottom-5 left-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      (mouseenter)="toastService.pause(toast.id)"
      (mouseleave)="toastService.resume(toast.id)"
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-xl border backdrop-blur-md transition-all duration-300 transform translate-y-0"
      [ngClass]="{
        'bg-emerald-50/95 border-emerald-300 text-emerald-900 dark:bg-emerald-950/90 dark:border-emerald-800 dark:text-emerald-100': toast.type === 'success',
        'bg-rose-50/95 border-rose-300 text-rose-900 dark:bg-rose-950/90 dark:border-rose-800 dark:text-rose-100': toast.type === 'error',
        'bg-amber-50/95 border-amber-300 text-amber-900 dark:bg-amber-950/90 dark:border-amber-800 dark:text-amber-100': toast.type === 'warning',
        'bg-sky-50/95 border-sky-300 text-sky-900 dark:bg-sky-950/90 dark:border-sky-800 dark:text-sky-100': toast.type === 'info'
      }"
    >
      <div class="text-xl mt-0.5">
        @if (toast.type === 'success') { <i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i> }
        @if (toast.type === 'error') { <i class="fa-solid fa-circle-exclamation text-rose-600 dark:text-rose-400"></i> }
        @if (toast.type === 'warning') { <i class="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400"></i> }
        @if (toast.type === 'info') { <i class="fa-solid fa-circle-info text-sky-600 dark:text-sky-400"></i> }
      </div>
      <div class="flex-1">
        <h4 class="font-bold text-sm">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="text-xs mt-0.5 opacity-90 leading-relaxed">{{ toast.message }}</p>
        }
      </div>
      <button
        (click)="toastService.remove(toast.id)"
        class="text-xs opacity-60 hover:opacity-100 transition-opacity p-1"
        aria-label="إغلاق التنبيه"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  }
</div>
